name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS ZIP (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and packaging dependencies
        run: python -m pip install --disable-pip-version-check -r server/requirements.txt "pyinstaller>=6.18,<7"

      - name: Build application folder
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --name CjChatBot \
            --add-data "$GITHUB_WORKSPACE/web:web" \
            --collect-all TikTokLive \
            --collect-all TikTokLiveProto \
            --distpath dist \
            --specpath build/pyinstaller \
            --workpath build/pyinstaller \
            packaging/launcher.py

      - name: Create macOS ZIP
        run: |
          cp LICENSE README.md packaging/Start-CjChatBot.command dist/CjChatBot/
          chmod +x dist/CjChatBot/Start-CjChatBot.command
          ditto -c -k --sequesterRsrc --keepParent \
            dist/CjChatBot \
            "CjChatBot-macOS-${{ matrix.arch }}.zip"

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CjChatBot-macOS-${{ matrix.arch }}
          path: CjChatBot-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $innoSetup = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6"
          if (-not (Test-Path (Join-Path $innoSetup "ISCC.exe"))) {
            choco install innosetup --no-progress --yes
          }
          if (-not (Test-Path (Join-Path $innoSetup "ISCC.exe"))) {
            throw "Inno Setup was not installed successfully."
          }
          $innoSetup | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install application and packaging dependencies
        run: python -m pip install --disable-pip-version-check -r server/requirements.txt "pyinstaller>=6.18,<7"

      - name: Build application folder
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name CjChatBot `
            --icon web/assets/favicon.ico `
            --add-data "$env:GITHUB_WORKSPACE\web;web" `
            --collect-all TikTokLive `
            --collect-all TikTokLiveProto `
            --distpath dist `
            --specpath build/pyinstaller `
            --workpath build/pyinstaller `
            packaging/launcher.py

      - name: Add app resources and build installer
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md, packaging/Start-CjChatBot.bat -Destination dist/CjChatBot
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME -replace '^v', '' } else { "1.0.0" }
          $compiler = Get-Command ISCC.exe -ErrorAction Stop
          & $compiler.Source "/DMyAppVersion=$version" packaging/CjChatBot.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed to build the Windows installer."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CjChatBot-Windows
          path: dist/CjChatBot-Setup.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish versioned release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
